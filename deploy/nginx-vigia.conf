# /etc/nginx/sites-available/vigia  (symlink en sites-enabled)
# Límites por IP: generosos para agentes, suficientes para frenar abuso. Las zonas viven en el contexto http.
limit_req_zone $binary_remote_addr zone=vigia_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=vigia_heavy:10m rate=30r/m;
# Sólo los envíos (POST) del revisor web cuentan para este límite; las páginas GET usan el límite general.
map $request_method $vigia_form_key { POST $binary_remote_addr; default ""; }
limit_req_zone $vigia_form_key zone=vigia_form:10m rate=20r/m;

server {
    listen 80;
    server_name vigia.coredls.cloud;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name vigia.coredls.cloud;

    ssl_certificate /etc/letsencrypt/live/vigia.coredls.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vigia.coredls.cloud/privkey.pem;

    client_max_body_size 256k;
    limit_req_status 429;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # Verificación de dominio para el registro oficial de MCP (clave pública; la privada queda en /opt/vigia-registry).
    location = /.well-known/mcp-registry-auth {
        alias /var/www/vigia-wellknown/mcp-registry-auth;
        default_type text/plain;
    }

    # Verificación de Google Search Console (cuenta dlsantos.matias@gmail.com). No borrar: Google la revisa periódicamente.
    location = /googled2a1545c1312aea2.html {
        default_type text/html;
        return 200 "google-site-verification: googled2a1545c1312aea2.html";
    }

    # Endpoints costosos (resolución en vivo de muchas dependencias, MCP): límite más estricto.
    location = /v1/check {
        limit_req zone=vigia_heavy burst=10 nodelay;
        proxy_pass http://127.0.0.1:3005;
        proxy_read_timeout 120s;
    }
    location = /mcp {
        limit_req zone=vigia_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3005;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Revisor web (/check y /{idioma}/check): límite estricto sólo para POST.
    location ~ ^/([a-z]{2}/)?check$ {
        limit_req zone=vigia_form burst=5 nodelay;
        limit_req zone=vigia_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3005;
        proxy_read_timeout 120s;
    }

    # Sin micro-caché: la app responde en ~80 ms y así la medición de uso cuenta todas las visitas.
    location / {
        limit_req zone=vigia_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3005;
    }
}
