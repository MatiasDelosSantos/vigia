# /etc/nginx/sites-available/vigia  (symlink en sites-enabled)
# Límites por IP: generosos para agentes, suficientes para frenar abuso. Las zonas viven en el contexto http.
limit_req_zone $binary_remote_addr zone=vigia_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=vigia_heavy:10m rate=30r/m;
proxy_cache_path /var/cache/nginx/vigia levels=1:2 keys_zone=vigia_cache:20m max_size=1g inactive=1h use_temp_path=off;

server {
    listen 80;
    server_name vigia.coredls.cloud;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name vigia.coredls.cloud;

    ssl_certificate /etc/letsencrypt/live/vigia.coredls.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vigia.coredls.cloud/privkey.pem;

    client_max_body_size 256k;
    limit_req_status 429;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # Endpoints costosos (resolución en vivo de muchas dependencias, MCP): límite más estricto.
    location = /v1/check {
        limit_req zone=vigia_heavy burst=10 nodelay;
        proxy_pass http://127.0.0.1:3005;
        proxy_read_timeout 120s;
    }
    location = /mcp {
        limit_req zone=vigia_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3005;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Todo lo demás es GET cacheable: micro-cache en Nginx que respeta Cache-Control de la app.
    location / {
        limit_req zone=vigia_api burst=40 nodelay;
        proxy_cache vigia_cache;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503;
        proxy_cache_background_update on;
        add_header X-Cache $upstream_cache_status always;
        proxy_pass http://127.0.0.1:3005;
    }
}
